<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filters</title>
    <style>
        .img1{
            filter: blur(1px);
            filter: drop-shadow(2);
        }

        .img2{
            filter: sepia(1);
            filter: brightness(200%);
            filter: contrast(10px);
            filter: grayscale(1);
            filter: hue-rotate(90deg);
            /* filter: drop-shadow(37px 18px 10px red); */
        }
    </style>
</head>
<body>
    <img class="img1" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvvxTSEnrwX9bf4J96xrYmFsvUVPxbx434NP61hTlsrC8A6dsF9bQ1Wkpx&s=10" alt="">
    <img class="img2" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvvxTSEnrwX9bf4J96xrYmFsvUVPxbx434NP61hTlsrC8A6dsF9bQ1Wkpx&s=10" alt="">
</body>
</html>
