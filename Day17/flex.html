<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Box</title>
    <style>
        :root{
            --back:2px solid blue;
        }
        .container{
            /* margin: 0; */
            padding: 0;
            display: flex;
            /* flex-direction: column; */ 
            /* flex-wrap: wrap-reverse; */
            height: 80vh;
            border:var(--back) ;
            justify-content: center;
            /* align-items: center; */
            align-content: center;
            /* combination of flex direction and flex wrap */
            /* flex-flow: column wrap; */
            /* gap: 5rem; */
            row-gap: 5px;
            column-gap: 6px;
        }


        .box{
            background-color: blue;
            border: 2px solid red;
            padding: 10px 20px;
            margin: 10px;
            width: 10px;
            height: 10px;
            /* flex-grow: 1; */
        }
        .box:first-child{
            flex-shrink: 2;
        }
        .order1{
            /* order: 1; */
            /* flex-grow: 3; */
            flex-shrink: 2;
            align-self: flex-end;
        }
        .order2{
            order:3;
            align-self: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box order1"  >1</div>
        <div class="box order2">2</div>
        <div class="box">3</div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <!-- <div class="box"></div>
        <div class="box"></div> -->
    </div>
</body>
</html>
