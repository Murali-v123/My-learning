<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All About Transform</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            border:2px solid blue;
            background-color: aqua;
            height: 80vh;
            width: 80vw;
        }
        .box{
            border: 2px solid black;
            border-radius: 10px;
            width: 20vw;
            height: 20vh;
            background-color: blue;
            color: aliceblue;
            justify-content: center;
            align-items: center;
            display: flex;
            /* transform: rotate(25deg);  rotate towards  25 degree*/
            /* transform: rotate(0.25turn); /*rotate towards  90degree turn */
            /* transform: rotateX(25deg);  rotate towards x axis
            transform: rotateY(25deg); rotatex towards y axis*/
            /* transform: scale(2.0); makes the size of box 2 times*/
            /* transform: skew(60deg);turns the box */
            /* transform: translateX(35px); moves the box 35px towards right */
            /* transform: translatey(35px); moves the box 35px towards down */
            /* transform: skew(30deg) rotate(15deg);using multiple transform property */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">box1</div>
    </div>
</body>
</html>
