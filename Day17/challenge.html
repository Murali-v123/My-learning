<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            /* border: 2px solid blue; */
            background-color:rgb(154, 236, 236) ;
            height: 80vh;
            justify-content: space-around;
            align-items: flex-start; /* Vertically centers the logo and list in the header */
        }

        .logo{
            background-color: black;
            color: yellow;
            width: 35px;
            font-weight: bold;
            /* Removed the 55px restriction so text doesn't wrap */
            padding: 5px 15px; 
            margin: 15px;
            display: flex; /* Aligns UE and Ultraedit side-by-side */
            align-items: center; 
            gap: 10px; /* Adds space between UE and Ultraedit */
            font-size: xx-large;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif ;
        }
        
        .bx {
            color: white; /* Changed to white so it is readable on the black background */
            font-size: large; /* Adjust sizing for the icon text if needed */
            color: black;
            margin-left: 10px;
        }

        .list {
            display: flex;
            list-style-type: none;
            gap: 30px;
        }
        .list li{
            justify-content: center;
            align-items: center;
            display: flex;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav>
        <header>
            <div class="container">
                <div class="logo">
                    UE 
                    <!-- Fixed misspelled sapn tag and removed invalid grid properties -->
                <span class="bx" style="display: inline;">Ultraedit</span>
            </div>
            <ul class="list">
                <li>products <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9"></path>
</svg></li>
            <li>pricing <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9"></path>
</svg></li>
            <li>resource <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9"></path>
</svg></li>
            <li>about <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9"></path>
</svg></li>
        </ul>
    </div>
</header>
</nav>
</body>
</html>
